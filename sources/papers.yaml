# sources/papers.yaml — 轻量论文 Source registry（V2 MVP）
#
# 字段契约（轻量、按需，不引入 schema / sidecar / 额外 registry 文件）：
#
# 始终必需字段：
#   id:          稳定 source id（字符串，仓库内唯一）
#   title:       论文正式标题
#   added_at:    被知识库摄入日期 (YYYY-MM-DD)
#   pdf:         相对于仓库根的 PDF 路径（sources/papers/ 下，走 Git LFS）
#
# 可选字段（适用且可靠获得时记录；不知道就省略，而非猜）：
#   arxiv:               arXiv 编号（如 "2507.04447"）
#   doi:                 DOI
#   published_at:        论文首次发布日期 (YYYY-MM-DD)
#   latest_version:      当前所选版本号（如 "v3"）
#   version_published_at: 当前版本发布日期 (YYYY-MM-DD)
#   authors:             [可靠获得时]
#   venue:               [可靠获得时]
#
# code（最小结构，区分三种状态）：
#   code: { available: true, url: "<官方代码链接>" }   # 已确认有官方代码
#   code: { available: false }                          # 已确认无官方开源代码
#   （字段整体省略）                                      # 尚未可靠核验
#
# 同篇论文当前工作树只保留最新 PDF，旧版本由 Git history 保存。

papers:
  - id: arxiv-2602.19313
    title: "TOPReward: Token Probabilities as Hidden Zero-Shot Rewards for Robotics"
    added_at: 2026-08-07
    pdf: "sources/papers/TOPReward - Token Probabilities as Hidden Zero-Shot Rewards for Robotics.pdf"
    arxiv: "2602.19313"
    doi: "10.48550/arXiv.2602.19313"
    published_at: 2026-02-22
    latest_version: "v2"
    version_published_at: 2026-07-22
    authors:
      - Shirui Chen
      - Cole Harrison
      - Ying-Chun Lee
      - Angela Jin Yang
      - Zhongzheng Ren
      - Lillian J. Ratliff
      - Jiafei Duan
      - Dieter Fox
      - Ranjay Krishna
    code:
      available: true
      url: "https://github.com/TOPReward/TOPReward"
